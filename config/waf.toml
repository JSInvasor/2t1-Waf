# 2t1-Waf configuration
# Reload with SIGHUP

[server]
# Address the WAF listens on (clients connect here).
listen = "0.0.0.0:8080"
# Number of Pingora worker threads. 0 = number of CPU cores.
threads = 0
# Trust X-Forwarded-For from this many hops (0 = use socket peer).
trusted_proxy_hops = 0

[upstream]
# Origin server the WAF protects.
address = "127.0.0.1:8000"
sni = "localhost"
tls = false
connect_timeout_ms = 2000
read_timeout_ms = 30000

[limits]
# Maximum request body size in bytes (1 MiB default).
max_body_bytes = 1048576
# Maximum number of headers in a request.
max_headers = 100
# Maximum length of any single header value.
max_header_value_bytes = 8192
# Maximum URI length.
max_uri_bytes = 8192
# Allowed HTTP methods.
allowed_methods = ["GET", "HEAD", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]

[rate_limit]
# Sliding-window rate limit per client IP.
enabled = true
requests_per_minute = 600
burst = 60
# Per-path stricter rate limits (regex on path).
[[rate_limit.routes]]
pattern = "^/(login|signin|auth|register)"
requests_per_minute = 20
burst = 5

[reputation]
# Static allow / deny CIDRs. Allow always wins.
allow_cidrs = []
deny_cidrs = []
# Auto-ban an IP that scores >= ban_threshold this many times within window_secs.
auto_ban_threshold_hits = 5
auto_ban_window_secs = 60
auto_ban_duration_secs = 3600

[geoip]
# Optional MaxMind GeoLite2-Country.mmdb path. Leave empty to disable.
mmdb_path = ""
# ISO country codes to block outright.
block_countries = []
# Countries to apply extra scrutiny (added bot score).
suspicious_countries = []

[detection]
# Bot/anomaly scoring. Total score >= challenge_threshold triggers JS challenge,
# >= block_threshold triggers a hard block. 0..100.
challenge_threshold = 40
block_threshold = 70
# Toggle individual rule families.
sqli   = true
xss    = true
traversal = true
cmdi   = true
lfi    = true
# Suspicious User-Agent substrings (case-insensitive).
suspicious_user_agents = [
    "sqlmap", "nikto", "acunetix", "nessus", "nmap", "masscan", "zgrab",
    "fuzz", "wpscan", "dirbuster", "gobuster", "feroxbuster", "ffuf",
    "havij", "burpcollaborator", "qualys", "openvas", "metasploit",
]

[challenge]
# HMAC key for signed cookies. CHANGE THIS in production. 32+ random bytes.
hmac_secret = "change-me-to-a-long-random-secret-please-change-me"
# Cookie name set after a successful challenge.
cookie_name = "__2t1_clearance"
# Lifetime in seconds.
cookie_ttl_secs = 1800
# Required proof-of-work difficulty (number of leading zero hex chars).
pow_difficulty = 4

[logging]
# json | text
format = "json"
# trace | debug | info | warn | error
level = "info"

[admin]
# Local admin API for the dashboard. Bind to localhost.
listen = "127.0.0.1:9090"
